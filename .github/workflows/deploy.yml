name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the site is the page and the two files it asks for — the README,
      # the gif it embeds and the keymap json stay out of the upload
      - name: Assemble the site
        run: |
          mkdir dist
          cp index.html tangent-demo.mp4 screenshot.png dist/

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=tangent-trainer
            --branch=main
