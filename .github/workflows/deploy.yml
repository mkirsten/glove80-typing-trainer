name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # everything ships unless it's named below, so a new asset needs no
      # thought here — the list is repo furniture the site never asks for
      - name: Assemble the site
        run: |
          rsync -a ./ dist/ \
            --exclude '.git*' \
            --exclude '.wrangler' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            --exclude 'factory-default-macos.json' \
            --exclude 'tangent-demo.gif'
          echo "shipping:" && ls -la dist/

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=tangent-trainer
            --branch=main
